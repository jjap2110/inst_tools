<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23142644'/><text x='16' y='22' text-anchor='middle' font-size='18' fill='%2300BCD4'>⚙</text></svg>">
<title>Herramientas de Campo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #142644;
    --navy-light: #1e3a5f;
    --accent: #00BCD4;
    --accent-bg: rgba(0,188,212,0.08);
    --accent-border: rgba(0,188,212,0.2);
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --text: #1a2744;
    --text-sub: #5a6a7e;
    --border: rgba(20,38,68,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header band ── */
  .hero {
    background: var(--navy);
    padding: 2.5rem 1.5rem 2rem;
    text-align: center;
  }

  .hero h1 {
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ffffff;
  }

  .hero p {
    margin-top: 0.35rem;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.5);
    font-weight: 400;
  }

  .hero .accent-line {
    width: 40px;
    height: 3px;
    background: var(--accent);
    margin: 1rem auto 0;
    border-radius: 2px;
  }

  /* ── Content area ── */
  .content {
    max-width: 500px;
    margin: 0 auto;
    padding: 1.5rem 1rem 2rem;
  }

  .section-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.75rem;
    padding-left: 4px;
  }

  /* ── Card style B ── */
  .modules {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  .card:active {
    border-color: var(--accent-border);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }

  .card-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .card-icon svg {
    width: 22px;
    height: 22px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 3px;
  }

  .card-desc {
    font-size: 0.78rem;
    color: var(--text-sub);
    line-height: 1.35;
  }

  .card-arrow {
    color: #bcc5d0;
    font-size: 1.3rem;
    flex-shrink: 0;
    margin-left: 4px;
  }

  /* ── Footer ── */
  footer {
    background: var(--navy);
    text-align: center;
    padding: 1.5rem 1rem;
    margin-top: 2rem;
  }

  footer span {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.35);
  }
</style>
</head>
<body>

<div class="hero">
  <h1>Herramientas de Campo</h1>
  <p>Instrumentación Industrial</p>
  <div class="accent-line"></div>
</div>

<div class="content">
  <div class="section-label">Módulos disponibles</div>

  <div class="modules">

    <a class="card" href="sim_caudal.html">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M2 12c2-3 4-3 6 0s4 3 6 0 4-3 6 0"/><path d="M2 7c2-3 4-3 6 0s4 3 6 0 4-3 6 0" opacity=".35"/><path d="M2 17c2-3 4-3 6 0s4 3 6 0 4-3 6 0" opacity=".35"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">Simulador de Caudal</div>
        <div class="card-desc">Simulación de caudal para caudalímetros</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a class="card" href="Conc_Dens.html">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6.5L4 18a1 1 0 0 0 .87 1.5h14.26A1 1 0 0 0 20 18l-6-8.5V3"/><path d="M7 15h10" opacity=".45"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">Densidad → Concentración</div>
        <div class="card-desc">Conversión densidad a concentración · MFC 400</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="card-body">
        <div class="card-title">Nombre del módulo</div>
        <div class="card-desc">Descripción breve</div>
      </div>
      <span class="card-arrow">›</span>
    </a>

    ══════════════════════════════════════ -->

  </div>
</div>

<footer>
  <span>Josmar Angulo</span>
  <span>2026</span>
</footer>

</body>
</html>
