<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Herramientas">
<meta name="theme-color" content="#142644">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23142644'/><text x='16' y='22' text-anchor='middle' font-size='18' fill='%2300BCD4'>⚙</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%23142644'/><text x='90' y='118' text-anchor='middle' font-size='90' fill='%2300BCD4'>⚙</text></svg>">
<title>Herramientas de Campo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #142644;
    --navy-deep: #0d1a30;
    --accent: #00BCD4;
    --accent-bg: rgba(0,188,212,0.07);
    --accent-border: rgba(0,188,212,0.18);
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --text: #1a2744;
    --text-sub: #5a6a7e;
    --border: rgba(20,38,68,0.07);
    --shadow: 0 1px 3px rgba(20,38,68,0.06), 0 1px 2px rgba(20,38,68,0.04);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ── Hero ── */
  .hero {
    background: linear-gradient(170deg, var(--navy) 0%, var(--navy-deep) 100%);
    padding: 3rem 1.5rem 2.2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.4;
  }

  .hero h1 {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
  }

  .hero p {
    margin-top: 0.4rem;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.55);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  .hero .accent-line {
    width: 36px;
    height: 3px;
    background: var(--accent);
    margin: 1.1rem auto 0;
    border-radius: 2px;
  }

  /* ── Content ── */
  .content {
    max-width: 500px;
    margin: 0 auto;
    padding: 1.5rem 1rem 2rem;
    width: 100%;
    flex: 1;
  }

  .section-label {
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.8rem;
    padding-left: 2px;
  }

  /* ── Cards ── */
  .modules {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 15px 16px;
    box-shadow: var(--shadow);
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    animation: cardIn 0.35s ease both;
  }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.2s; }
  .card:nth-child(5) { animation-delay: 0.25s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card:active {
    transform: scale(0.98);
    border-color: var(--accent-border);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }

  @media (hover: hover) {
    .card:hover {
      border-color: var(--accent-border);
      box-shadow: var(--shadow), 0 0 0 3px var(--accent-bg);
    }
  }

  .card-icon {
    width: 44px;
    height: 44px;
    border-radius: 11px;
    background: var(--accent-bg);
    border: 1px solid var(--accent-border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .card-icon svg {
    width: 21px;
    height: 21px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .card-body {
    flex: 1;
    min-width: 0;
  }

  .card-title {
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 2px;
  }

  .card-desc {
    font-size: 0.76rem;
    color: var(--text-sub);
    line-height: 1.35;
  }

  .card-arrow {
    color: #c3cad3;
    font-size: 1.25rem;
    flex-shrink: 0;
    transition: transform 0.15s, color 0.15s;
  }

  .card:active .card-arrow {
    transform: translateX(2px);
    color: var(--accent);
  }

  /* ── Footer ── */
  footer {
    background: linear-gradient(170deg, var(--navy) 0%, var(--navy-deep) 100%);
    text-align: center;
    padding: 1.4rem 1rem;
    position: relative;
  }

  footer::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.25;
  }

  footer .name {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.03em;
  }

  footer .year {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.3);
    margin-top: 0.2rem;
  }
</style>
</head>
<body>

<div class="hero">

</div>
